<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Clicker</title>
    <script src="main.js" defer></script>
    <link rel="icon" type="image/x-icon" href="assets/favicon/favicon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="mainGame">
        <div id="left">

        </div>

        <div id="center">
            <p>Cats: <span id="bank">0</span></p>
            <p>Per Second: <span id="playerPerSecond">0</span></p>
            <img src="assets/cats/whiteCat.png" id="clickableCat" alt="white cat" draggable="False">
        </div>

        <div id="right">
            <div id="upgradesSection">
                <p id="upgHeader">Upgrades</p>
                <div id="buyUpgrades">
                    <!-- ENTER UPGRADES BELOW -->

                    <div id="upgrade">
                        <p id="upgHeader">Upgrades</p>
                    </div>

                    <!-- ENTER UPGRADES ABOVE -->
                </div>
            </div>

            <div id="buildingsSection">
                <p id="bldHeader">Buildings</p>
                <div id="buyBuildings">
                    <!-- ENTER BUILDINGS BELOW -->

                    <div id="building">
                        <div id="left">
                            <img src="/assets/buildings/cursor.png" alt="cursor">
                        </div>
                        <div id="middle">
                            <p>Cursor</p>
                            <p>Cost: <span id="price">15</span></p>
                        </div>
                        <div id="left">
                            <p>Owned: <span id="owned">0</span></p>
                        </div>
                    </div>

                    <div id="building">
                        <div id="left">

                        </div>
                        <div id="middle">

                        </div>
                        <div id="left">

                        </div>
                    </div>

                    <div id="building">
                        <div id="left">

                        </div>
                        <div id="middle">

                        </div>
                        <div id="left">

                        </div>
                    </div>

                    <div id="building">
                        <div id="left">

                        </div>
                        <div id="middle">

                        </div>
                        <div id="left">

                        </div>
                    </div>

                    <!-- ENTER BUILDINGS ABOVE -->
                </div>
            </div>
        </div>
    </div>
</body>
</html>
