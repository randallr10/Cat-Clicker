<!DOCTYPE html>
<html>
<head>
<style>
  .scroll-box {
    width: 300px;
    height: 150px; /* Required so content knows when to overflow */
    overflow-y: auto; /* Adds a vertical scrollbar only when needed */
    border: 1px solid #ccc;
    padding: 10px;
  }
</style>
</head>
<body>

<div class="scroll-box">
  <p>Add enough text or elements here so that the content is taller than 150px. Once the content exceeds the height of the container, a vertical scroll bar will automatically appear on the right side.</p>
  <p>More content to trigger scrolling...</p>
  <p>Even more content to trigger scrolling...</p>
</div>

</body>
</html>
